name: Nightly

on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:

permissions:
  packages: write
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Run tests
        run: |
          pip install -r requirements.txt
          pytest

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push
        run: |
          IMAGE=ghcr.io/${{ github.repository_owner }}/fastapi-beyond-crud
          docker build -t $IMAGE:nightly .
          docker push $IMAGE:nightly

      - name: Email if failed
        if: failure()
        run: |
          curl -X POST https://api.sendgrid.com/v3/mail/send \
          -H "Authorization: Bearer $SENDGRID_API_KEY" \
          -H "Content-Type: application/json" \
          -d '{
            "personalizations":[{"to":[{"email":"'"$ALERT_EMAIL_TO"'"}]}],
            "from":{"email":"'"$ALERT_EMAIL_FROM"'"},
            "subject":"Nightly Build Failed",
            "content":[{"type":"text/plain","value":"Nightly build failed."}]
          }'
        env:
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
          ALERT_EMAIL_FROM: ${{ secrets.ALERT_EMAIL_FROM }}